name: Build Docker
run-name: Build Docker ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Sendy version to build (e.g, 6.1.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Sendy version to build'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SENDY_LICENSE_KEY:
        required: true

concurrency:
  group: sendy-docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          fetch-tags: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve latest Sendy version
        id: release
        uses: ./.github/actions/resolve-sendy-version

      - name: Verify requested version is the current Sendy release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          echo "Requested version:              ${REQUESTED_VERSION}"
          if [ "$REQUESTED_VERSION" != "$LATEST_VERSION" ]; then
            echo "::error::Requested version '${REQUESTED_VERSION}' is not the current Sendy release '${LATEST_VERSION}'. The download endpoint only serves the latest version the license is entitled to, so building '${REQUESTED_VERSION}' would mislabel the image."
            exit 1
          fi
          echo "Version check passed: ${REQUESTED_VERSION} is the current Sendy release."

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SENDY_VERSION=${{ inputs.version }}
          secrets: |
            SENDY_LICENSE_KEY=${{ secrets.SENDY_LICENSE_KEY }}
          tags: |
            marcelorodrigo/sendy:${{ inputs.version }}
            marcelorodrigo/sendy:latest
