name: PR Build Check

on:
  pull_request:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'entrypoint.d/**'
      - 's6-rc.d/**'
      - 'includes/config.php'
      - 'sendy.crontab'
      - '.github/workflows/pr-build.yml'
      - '.github/workflows/build-and-push.yml'
      - '.github/workflows/check-sendy-release.yml'
      - '.github/actions/resolve-sendy-version/**'
      - '.github/scripts/**'

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-version-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          fetch-tags: false

      - name: Test Sendy version parser
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  build-and-smoke-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          fetch-tags: false

      - name: Resolve latest Sendy version
        id: resolve_version
        uses: ./.github/actions/resolve-sendy-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: sendy:pr-smoke-test
          build-args: |
            SENDY_VERSION=${{ steps.resolve_version.outputs.version }}
          secrets: |
            SENDY_LICENSE_KEY=${{ secrets.SENDY_LICENSE_KEY }}
          cache-from: type=gha,scope=sendy-amd64
          cache-to: type=gha,mode=max,scope=sendy-amd64

      - name: Boot smoke test
        run: |
          set -euo pipefail

          echo "Starting container from sendy:pr-smoke-test ..."
          CONTAINER_ID=$(docker run -d \
            -e SENDY_URL=http://localhost \
            -e MYSQL_HOST=smoke-test-host \
            -e MYSQL_USER=smoke-test-user \
            -e MYSQL_PASSWORD=smoke-test-password \
            -p 8080:8080 \
            sendy:pr-smoke-test)

          cleanup() {
            echo "----- container logs -----"
            docker logs "$CONTAINER_ID" || true
            echo "---------------------------"
            docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for the container to become ready..."
          READY=""
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null)" != "true" ]; then
              echo "::error::Container exited unexpectedly while waiting for readiness."
              exit 1
            fi

            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$CONTAINER_ID" 2>/dev/null || true)
            if [ "$HEALTH" = "healthy" ]; then
              READY="healthcheck"
              break
            fi
            if [ -z "$HEALTH" ] && curl -fsS -o /dev/null "http://localhost:8080/" 2>/dev/null; then
              READY="http"
              break
            fi

            sleep 2
          done

          if [ -z "$READY" ]; then
            echo "::error::Container did not become ready within the timeout (no healthy status and no HTTP response on :8080)."
            exit 1
          fi
          echo "Container is ready (signal: ${READY})."

          echo "Checking environment validation ran successfully..."
          if ! docker logs "$CONTAINER_ID" 2>&1 | grep -q "All required environment variables for Sendy are set"; then
            echo "::error::Expected environment validation success message not found in container logs."
            exit 1
          fi

          echo "Validating the Sendy crontab with Supercronic..."
          docker exec "$CONTAINER_ID" /usr/local/bin/supercronic -test /etc/sendy.crontab

          echo "Boot smoke test passed."

  build-arm64:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          fetch-tags: false

      - name: Resolve latest Sendy version
        id: resolve_version
        uses: ./.github/actions/resolve-sendy-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build check (linux/arm64, no load)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: false
          build-args: |
            SENDY_VERSION=${{ steps.resolve_version.outputs.version }}
          secrets: |
            SENDY_LICENSE_KEY=${{ secrets.SENDY_LICENSE_KEY }}
          cache-from: type=gha,scope=sendy-arm64
          cache-to: type=gha,mode=max,scope=sendy-arm64
