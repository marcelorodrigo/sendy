name: Build Docker
run-name: Build Docker ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Sendy version to build (e.g, 6.1.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Sendy version to build'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      SENDY_LICENSE_KEY:
        required: true

concurrency:
  group: sendy-docker-publish
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          fetch-tags: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve latest Sendy version
        id: release
        uses: ./.github/actions/resolve-sendy-version

      - name: Verify requested version is the current Sendy release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          echo "Requested version:              ${REQUESTED_VERSION}"
          if [ "$REQUESTED_VERSION" != "$LATEST_VERSION" ]; then
            echo "::error::Requested version '${REQUESTED_VERSION}' is not the current Sendy release '${LATEST_VERSION}'. The download endpoint only serves the latest version the license is entitled to, so building '${REQUESTED_VERSION}' would mislabel the image."
            exit 1
          fi
          echo "Version check passed: ${REQUESTED_VERSION} is the current Sendy release."

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=marcelorodrigo/sendy,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SENDY_VERSION=${{ inputs.version }}
          secrets: |
            SENDY_LICENSE_KEY=${{ secrets.SENDY_LICENSE_KEY }}
          cache-from: type=gha,scope=sendy-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sendy-release-${{ matrix.arch }}

      - name: Export image digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return a valid image digest."
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: sendy-digests-${{ matrix.arch }}-${{ github.run_id }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: sendy-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-platform manifests
        env:
          IMAGE: marcelorodrigo/sendy
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "$digest_file")")
          done

          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::Expected two platform image digests, found ${#sources[@]}."
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${sources[@]}"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"

          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
