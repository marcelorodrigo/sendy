name: Resolve Sendy version
description: Query the Sendy version endpoint and resolve the latest published version

outputs:
  version:
    description: The latest published Sendy version
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve latest Sendy version
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        echo "Fetching latest Sendy version from https://gateway.sendy.co/version-checker ..."
        LATEST_VERSION=$(curl \
          --connect-timeout 10 \
          --max-time 30 \
          --retry 3 \
          --retry-all-errors \
          --retry-delay 5 \
          -fsSL \
          https://gateway.sendy.co/version-checker)
        if [[ ! "$LATEST_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
          echo "::error::Sendy version endpoint returned an invalid response."
          exit 1
        fi
        echo "Latest published Sendy version: ${LATEST_VERSION}"
        echo "version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"
